# Application Settings
spring.application.name=cordys-crm
server.port=8083

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/cordys_crm?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
spring.datasource.username=root
spring.datasource.password=123456

# Redis Configuration
spring.redis.host=localhost
spring.redis.port=6379
spring.redis.password=
spring.redis.database=0

# JWT Configuration
jwt.secret=cordys-crm-secret-key
jwt.expiration=86400000

# File Upload Configuration
file.upload.path=/opt/cordys/uploads

# Frontend URL
frontend.url=http://localhost:3000